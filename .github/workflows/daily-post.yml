name: 毎朝の星座ランキング投稿

on:
  schedule:
    # 毎日 22:00 UTC = 日本時間 7:00（GitHub の混雑で数分〜30分ほど遅れることがあります）
    - cron: "0 22 * * *"
  workflow_dispatch:      # Actions 画面から手動実行もできる
    inputs:
      dry_run:
        description: "投稿せずに画像と文章だけ確認する"
        type: boolean
        default: true

permissions:
  contents: write   # 画像をリポジトリに保存するため

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 日本語フォントをインストール
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 今日の占いと画像を作成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RANKING_SALT: ${{ secrets.RANKING_SALT }}
          SITE_NAME: ${{ vars.SITE_NAME }}
        run: python main.py generate

      - name: 画像をリポジトリに保存（Threads/Instagram が画像URLを読むため）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/
          git commit -m "card: $(date -u +%F)" || echo "変更なし"
          git push
          sleep 20

      - name: SNSに投稿
        env:
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          # accounts.json に書いた名前と合わせる。アカウントを増やしたらここにも追加
          THREADS_ACCESS_TOKEN_1: ${{ secrets.THREADS_ACCESS_TOKEN_1 }}
          THREADS_ACCESS_TOKEN_2: ${{ secrets.THREADS_ACCESS_TOKEN_2 }}
          IG_ACCESS_TOKEN_1: ${{ secrets.IG_ACCESS_TOKEN_1 }}
          IG_USER_ID_1: ${{ secrets.IG_USER_ID_1 }}
          IG_ACCESS_TOKEN_2: ${{ secrets.IG_ACCESS_TOKEN_2 }}
          IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # 手動実行で dry_run にチェックしたときだけ確認モード。毎朝の定期実行は本番
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: python main.py post $DRY_RUN
